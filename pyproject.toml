[project]
name = "transcript-review-agent"
version = "0.1.0"
description = "Local evidence-preserving transcript review prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch==2.7.1+cu128; sys_platform == 'win32' or sys_platform == 'linux'",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "numpy==2.3.5",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "gpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
transcript-review = "transcript_review_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_review_agent"]
